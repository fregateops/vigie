# cert-manager deprecated CRD apiVersions.
#
# Two removal events worth flagging:
#   - cert-manager 0.11 renamed the API group from `certmanager.k8s.io` to
#     `cert-manager.io`, removing every kind under the old group.
#   - cert-manager 1.7 stopped serving v1alpha2 / v1alpha3 / v1beta1 of every
#     CRD under both `cert-manager.io` and `acme.cert-manager.io`. The only
#     served version since is `…/v1`.
#
# All replacements point straight at the current stable API (`…/v1`), even
# for the 0.11 entries whose immediate replacement at the time was a now-dead
# alpha — chart authors hitting this should jump to v1, not to a dead alpha.
#
# Severity is `warning` — these rules notify but do not block CI. Disable an
# individual finding via `--disable-rules=deprecation_cert-manager_<ver>-<Kind>`.
ruleSet: deprecation
rules:
  - id: cert-manager
    project: cert-manager
    severity: warning
    scope: removedAPI
    helpURI: https://cert-manager.io/docs/installation/upgrading/remove-deprecated-apis/
    removedAPIs:
      # Removed in 1.7 — cert-manager.io group
      - { apiVersion: cert-manager.io/v1alpha2, kind: Certificate,        removedIn: "1.7", replacement: cert-manager.io/v1 }
      - { apiVersion: cert-manager.io/v1alpha3, kind: Certificate,        removedIn: "1.7", replacement: cert-manager.io/v1 }
      - { apiVersion: cert-manager.io/v1beta1,  kind: Certificate,        removedIn: "1.7", replacement: cert-manager.io/v1 }
      - { apiVersion: cert-manager.io/v1alpha2, kind: CertificateRequest, removedIn: "1.7", replacement: cert-manager.io/v1 }
      - { apiVersion: cert-manager.io/v1alpha3, kind: CertificateRequest, removedIn: "1.7", replacement: cert-manager.io/v1 }
      - { apiVersion: cert-manager.io/v1beta1,  kind: CertificateRequest, removedIn: "1.7", replacement: cert-manager.io/v1 }
      - { apiVersion: cert-manager.io/v1alpha2, kind: Issuer,             removedIn: "1.7", replacement: cert-manager.io/v1 }
      - { apiVersion: cert-manager.io/v1alpha3, kind: Issuer,             removedIn: "1.7", replacement: cert-manager.io/v1 }
      - { apiVersion: cert-manager.io/v1beta1,  kind: Issuer,             removedIn: "1.7", replacement: cert-manager.io/v1 }
      - { apiVersion: cert-manager.io/v1alpha2, kind: ClusterIssuer,      removedIn: "1.7", replacement: cert-manager.io/v1 }
      - { apiVersion: cert-manager.io/v1alpha3, kind: ClusterIssuer,      removedIn: "1.7", replacement: cert-manager.io/v1 }
      - { apiVersion: cert-manager.io/v1beta1,  kind: ClusterIssuer,      removedIn: "1.7", replacement: cert-manager.io/v1 }

      # Removed in 1.7 — acme.cert-manager.io group
      - { apiVersion: acme.cert-manager.io/v1alpha2, kind: Order,     removedIn: "1.7", replacement: acme.cert-manager.io/v1 }
      - { apiVersion: acme.cert-manager.io/v1alpha3, kind: Order,     removedIn: "1.7", replacement: acme.cert-manager.io/v1 }
      - { apiVersion: acme.cert-manager.io/v1beta1,  kind: Order,     removedIn: "1.7", replacement: acme.cert-manager.io/v1 }
      - { apiVersion: acme.cert-manager.io/v1alpha2, kind: Challenge, removedIn: "1.7", replacement: acme.cert-manager.io/v1 }
      - { apiVersion: acme.cert-manager.io/v1alpha3, kind: Challenge, removedIn: "1.7", replacement: acme.cert-manager.io/v1 }
      - { apiVersion: acme.cert-manager.io/v1beta1,  kind: Challenge, removedIn: "1.7", replacement: acme.cert-manager.io/v1 }
