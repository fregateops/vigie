suite: autoscaling
tests:
  - it: renders an HPA and drops the Deployment replicas when enabled
    inputs:
      set:
        autoscaling.enabled: true
    asserts:
      - hasDocuments: 4
  - it: HPA targets the Deployment
    inputs:
      set:
        autoscaling.enabled: true
    target:
      kind: HorizontalPodAutoscaler
    asserts:
      - isKind: HorizontalPodAutoscaler
      - equal:
          path: spec.maxReplicas
          value: 5
      - equal:
          path: spec.scaleTargetRef.name
          value: release-name-basic
  - it: Deployment omits replicas under autoscaling
    inputs:
      set:
        autoscaling.enabled: true
    target:
      kind: Deployment
    asserts:
      - notExists:
          path: spec.replicas
  - it: production values file sizes the HPA
    inputs:
      values:
        - tests/unit/values/autoscaling-prod.yaml
    target:
      kind: HorizontalPodAutoscaler
    asserts:
      - equal:
          path: spec.minReplicas
          value: 3
      - equal:
          path: spec.maxReplicas
          value: 10
  - it: setJson overrides a whole block on top of the values file
    inputs:
      values:
        - tests/unit/values/autoscaling-prod.yaml
      setJson:
        autoscaling: '{"enabled": true, "minReplicas": 2, "maxReplicas": 4, "targetCPUUtilizationPercentage": 60}'
    target:
      kind: HorizontalPodAutoscaler
    asserts:
      - equal:
          path: spec.maxReplicas
          value: 4
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 60
