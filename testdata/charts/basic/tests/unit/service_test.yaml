suite: service
templates:
  - templates/service.yaml
tests:
  - it: exposes the http port and selects the workload
    target:
      kind: Service
    asserts:
      - isKind: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - equal:
          path: spec.ports[0].name
          value: http
      - expr: 'doc.spec.selector["app.kubernetes.io/name"] == "basic"'
