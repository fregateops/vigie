suite: serviceaccount
tests:
  - it: renders the three core resources by default
    asserts:
      - hasDocuments: 3
  - it: creates the ServiceAccount with chart labels
    target:
      kind: ServiceAccount
    asserts:
      - isKind: ServiceAccount
      - equal:
          path: metadata.name
          value: release-name-basic
      - expr: 'doc.metadata.labels["app.kubernetes.io/managed-by"] == "Helm"'
  - it: omits the ServiceAccount when disabled
    inputs:
      set:
        serviceAccount.create: false
    asserts:
      - hasDocuments: 2
