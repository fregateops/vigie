# yaml-language-server: $schema=https://raw.githubusercontent.com/fregateops/vigie/refs/heads/main/pkg/api/schema/v1/testfile.json
suite: deployment
templates:
  - templates/deployment.yaml
tests:
  - it: renders standard metadata and workload spec
    target:
      kind: Deployment
    asserts:
      - isKind: Deployment
      - isAPIVersion: apps/v1
      - equal:
          path: metadata.name
          value: release-name-basic
      - equal:
          path: spec.replicas
          value: 3
      - isType:
          path: spec.replicas
          of: int
      # Recommended-label keys contain dots, so they are addressed via CEL, not path:.
      - expr: 'doc.metadata.labels["app.kubernetes.io/name"] == "basic"'
      - expr: 'doc.metadata.labels["app.kubernetes.io/managed-by"] == "Helm"'
      - expr: 'doc.spec.selector.matchLabels["app.kubernetes.io/instance"] == "release-name"'
      - equal:
          path: spec.template.spec.serviceAccountName
          value: release-name-basic
  - it: configures the application container
    target:
      kind: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: basic
      - equal:
          path: spec.template.spec.containers[0].image
          value: "myrepo/app:1.2.3"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^myrepo/app:[0-9.]+$'
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 80
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 500m
      - matchSchema:
          path: spec.template.spec.containers[0].resources
          schema:
            type: object
            required: [limits, requests]
