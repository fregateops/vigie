# Per-chart vigie configuration for the `basic` example chart.
# Full reference: https://github.com/fregateops/vigie/blob/main/examples/.vigie.yaml

defaults:
  release:
    name: release-name
    namespace: default

lint:
  # This chart sets resource limits, so this rule never fires — shown here as
  # an example of how to opt a rule out.
  disableRules:
    - template-best-practices_missing-resource-limits

# `test:` is omitted on purpose: every test file lives under the default
# discovery root `<chart>/tests`, scanned recursively. The unit/ and
# integration/ sub-directories are organisation only — the tier a file runs in
# comes from its content and the active `--cluster`, never from its path.
