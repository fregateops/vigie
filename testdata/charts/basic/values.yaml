replicaCount: 3

# nginx so apply-tier integration tests can actually reach Ready and serve
# HTTP against a real cluster. Unit-tier tests assert the rendered image
# reference, so any change here cascades into tests/unit/*.yaml.
image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "stable-alpine"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# nginx serves its default page at "/"; probe there so pods reach Ready in a
# real cluster (nginx has no /healthz or /readyz endpoint).
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

nodeSelector: {}
tolerations: []
affinity: {}
