name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: go build
        run: go build ./...

      - name: schema up to date
        run: make check-schema

      - name: go test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  cross-build:
    # goreleaser also ships windows and darwin; a platform-specific API (e.g. a
    # Unix-only syscall field) would otherwise break only the release. Linux is
    # built by every other job, and arm64 shares amd64's OS-specific files, so
    # one target per other OS is enough.
    name: cross-build (windows, darwin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      # setup-go's cache is shared by every job and saved by whichever finishes
      # first, so it never holds windows/darwin objects; this one does.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: cross-build-${{ hashFiles('go.sum') }}
          restore-keys: cross-build-

      - name: build windows/amd64 and darwin/arm64
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/vigie & windows=$!
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/vigie & darwin=$!
          wait "$windows"
          wait "$darwin"

  smoke-cli:
    name: smoke CLI (testdata chart)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: build vigie
        run: go build -o vigie ./cmd/vigie

      - name: lint
        run: ./vigie lint testdata/charts/basic

      - name: validate (baseline)
        run: ./vigie validate testdata/charts/basic

      - name: test (unit tier)
        run: ./vigie test testdata/charts/basic
      
      - name: provision envtest binaries
        # setup-envtest is pinned via go.mod (go run resolves that version), so
        # the downloaded kube-apiserver/etcd match the controller-runtime we use.
        # KUBEBUILDER_ASSETS is honoured first by the envtest backend, so this
        # pins the control-plane version for both the CLI and the tagged tests.
        run: |
          ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest use 1.30 -p path)
          echo "resolved envtest assets: $ASSETS"
          echo "KUBEBUILDER_ASSETS=$ASSETS" >> "$GITHUB_ENV"

      - name: test (apply tier, envtest)
        run: ./vigie test testdata/charts/basic --cluster envtest

      - name: integration tests (envtest)
        run: go test -tags envtest ./...

  e2e-cli:
    name: e2e CLI (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [kind, k3d]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: build vigie
        run: go build -o vigie ./cmd/vigie

      - name: test (e2e, ${{ matrix.backend }})
        # ubuntu runners ship docker; --download-tools fetches the kind/k3d CLI
        # into the vigie cache, exercising the resolver's download path end to
        # end instead of requiring a preinstalled binary. 
        run: ./vigie test testdata/charts/basic --cluster ${{ matrix.backend }} --download-tools

  integration-k3d:
    name: integration tests (k3d)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Pinned to doctor.DefaultK3dVersion; the checksum comes from that
      # release's checksums.txt, pinned here rather than fetched alongside
      # the binary.
      K3D_VERSION: v5.9.0
      K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
      # Fail instead of skip if k3d or docker is missing, so a broken setup
      # cannot pass by testing nothing. kind is not installed and skips.
      VIGIE_INTEGRATION_REQUIRE: k3d,docker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: install k3d
        run: |
          curl -fsSL -o k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  k3d" | sha256sum --check
          sudo install -m 0755 k3d /usr/local/bin/k3d
          k3d version

      - name: integration tests
        run: go test -tags integration -timeout 20m -run 'K3d|NodeBackends' ./internal/cluster/k3d/ ./internal/runner/
