name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: go build
        run: go build ./...

      - name: schema up to date
        run: make check-schema

      - name: go test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  smoke-cli:
    name: smoke CLI (testdata chart)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: build vigie
        run: go build -o vigie ./cmd/vigie

      - name: lint
        run: ./vigie lint testdata/charts/basic

      - name: validate (baseline)
        run: ./vigie validate testdata/charts/basic

      - name: test (unit tier)
        run: ./vigie test testdata/charts/basic
