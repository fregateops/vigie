# yaml-language-server: $schema=https://raw.githubusercontent.com/fregateops/vigie/refs/heads/main/pkg/api/schema/v1/config.json
# .vigie.yaml — vigie per-chart configuration
#
# The modeline above gives editors autocomplete and validation for this file.
# For an offline or pinned copy: `vigie schema config > .vigie.config.schema.json`
# and point the modeline at it instead.
#
# Drop this file at the root of your Helm chart (next to Chart.yaml) and
# uncomment the keys you want to override. Every key is optional; if the file
# is absent or empty, vigie uses the built-in defaults shown below.
#
# This reference documents the config surface that ships today (`vigie lint`,
# `vigie test`); `vigie validate` / `vigie run` config keys are not documented
# yet — see the README.
#
# Reference: https://github.com/fregateops/vigie

# ---------------------------------------------------------------------------
# defaults — release identity passed to `helm template` for every test,
# unless a suite-level `defaults:` or a per-test `inputs:` block overrides it.
# ---------------------------------------------------------------------------
defaults:
  release:
    # Release name. Mirrors Helm's `--release-name`. Default: release-name
    name: release-name
    # Namespace. Mirrors Helm's `--namespace`. Default: default
    namespace: default

# ---------------------------------------------------------------------------
# lint — controls `vigie lint`.
# ---------------------------------------------------------------------------
lint:
  # Allowlist of rule sets to run. Empty/omitted means "all built-in sets".
  # Built-in sets:
  #   - helm-v3-lint            (delegates to Helm v3's `helm lint`)
  #   - chart-yaml              (Chart.yaml structure: apiVersion, name, version, description)
  #   - template-best-practices (hardcoded namespaces, missing resource limits, ...)
  #   - deprecation             (removed/deprecated Kubernetes APIs, plus operator-specific sets)
  # Overridden by the `--rule-sets` CLI flag.
  ruleSets:
    - chart-yaml
    - template-best-practices
    - deprecation

  # Denylist of individual rule IDs that must not run, even if their rule set
  # is enabled. Rule IDs are namespaced as `<ruleSet>_<id>`, for example:
  #   - chart-yaml_api-version
  #   - chart-yaml_name
  #   - chart-yaml_version
  #   - chart-yaml_description
  #   - template-best-practices_hardcoded-namespace
  #   - template-best-practices_missing-resource-limits
  #   - deprecation_k8s-api
  #   - deprecation_cert-manager
  #   - deprecation_grafana-operator
  # Distinct from `ignore` below: `disableRules` skips execution entirely;
  # `ignore` filters findings post-execution by file path. Additive with the
  # `--disable-rules` CLI flag.
  disableRules:
    - template-best-practices_missing-resource-limits

  # Kubernetes versions to render against for deprecation/version-aware rules.
  # Each version is a `MAJOR.MINOR` string. Empty/omitted means "all supported".
  # Overridden by the `--kube-version` CLI flag.
  kubeVersions:
    - "1.30"
    - "1.31"

  # Suppress findings for a specific rule, optionally scoped to file paths.
  # `paths` is a list of glob patterns matched against the finding's source
  # file path. Omit `paths` to suppress the rule everywhere.
  ignore:
    - rule: template-best-practices_missing-resource-limits
      paths:
        - templates/jobs/*.yaml

# ---------------------------------------------------------------------------
# test — controls `vigie test`, in every tier: the template tier (per-test
# render + assertions, the default) and the cluster tiers reached with
# `--cluster <backend>`.
#
# CLI: `vigie test ./mychart [--file f] [--tests dir] [--snapshot-dir dir]
#       [--cluster none|envtest|kind|k3d|kubeconfig]`.
# ---------------------------------------------------------------------------
test:
  # Directory `vigie test` scans recursively for `*_test.yaml`. Relative
  # paths resolve against the chart directory. Empty/omitted defaults to
  # `<chart>/tests`. Overridden by the `--tests` CLI flag.
  testsDir: tests/unit

  # Disable the per-test kubeconform pass. Default: false (schema runs).
  # Overridden by the `--schema=false` CLI flag.
  skipSchema: false

  # Kubernetes versions for the per-test kubeconform pass; each version runs
  # as a separate pass (matrix). Full `MAJOR.MINOR.PATCH` required.
  # Empty/omitted uses the built-in default. Overridden by `--kube-version`.
  kubeVersions:
    - "1.36.1"

  # -------------------------------------------------------------------------
  # test.cluster — per-backend settings for the cluster tiers.
  #
  # These blocks do NOT select a tier: `vigie test` renders in-process unless
  # you pass `--cluster <backend>`, and only the selected backend's block is
  # read. Configure them once here and switch tiers from the CLI.
  # -------------------------------------------------------------------------
  cluster:
    # envtest — a real kube-apiserver + etcd in-process, no controllers.
    envtest:
      # Kubernetes version of the envtest binary assets (kube-apiserver, etcd).
      # Empty/omitted uses the built-in default. Overridden by `--kube-version`.
      kubeVersion: "1.36.1"

    # kind — a throwaway cluster provisioned by driving the external kind CLI.
    kind:
      # Node image version. Empty/omitted uses kind's own default.
      # Overridden by `--kube-version`.
      kubeVersion: "1.36.1"
      # Path to the kind CLI. Empty/omitted resolves it from PATH, then the
      # vigie binary cache, then an optional download. Overridden by
      # `--kind-binary`.
      binary: ""
      # Extra flags passed verbatim to `kind create cluster`.
      extraArgs:
        - --config
        - kind-3node.yaml

    # k3d — a throwaway k3s cluster provisioned by driving the external k3d CLI.
    k3d:
      kubeVersion: "1.36.1"
      # Path to the k3d CLI; same resolution as kind. Overridden by `--k3d-binary`.
      binary: ""
      # Extra flags passed verbatim to `k3d cluster create`.
      extraArgs:
        - -v
        - /host:/node

    # kubeconfig — a cluster you already run, reached via an external kubeconfig.
    kubeconfig:
      # Path to the kubeconfig file. Mirrors `helm --kubeconfig`. Required for
      # `--cluster kubeconfig`. Overridden by the `--kubeconfig` CLI flag.
      # No shell expansion happens here, so write it out in full rather than
      # using `~`; relative paths resolve against the working directory.
      path: /home/me/.kube/config
