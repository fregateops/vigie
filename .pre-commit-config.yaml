repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        language: system
        entry: gofmt -l -w
        files: \.go$

      - id: golangci-lint
        name: golangci-lint
        language: system
        entry: golangci-lint run
        pass_filenames: false
        files: \.go$
