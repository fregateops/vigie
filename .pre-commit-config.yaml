repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        language: system
        entry: gofmt -l -w
        files: \.go$

      - id: golangci-lint
        name: golangci-lint
        language: system
        entry: golangci-lint run
        pass_filenames: false
        files: \.go$

      - id: check-schema
        name: schema in sync with DSL types
        entry: make check-schema
        language: system
        pass_filenames: false
        files: \.go$
